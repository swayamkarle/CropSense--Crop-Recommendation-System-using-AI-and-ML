<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - CropSense AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <canvas id="dots" class="bg-dots" aria-hidden="true"></canvas>

  <!-- Top bar -->
  <header class="topbar topbar--login">
    <div class="brand">
      <img class="brand-logo-main" src="assets/logo-main.png" alt="CropSense AI"
           onerror="this.style.display='none';">
      <div class="brand-logo-fallback">CropSense AI</div>
    </div>
  </header>

  <!-- Login main -->
  <main class="wrap wrap-login">
    <section class="login-shell">
      <!-- LEFT PANEL -->
      <aside class="login-left">
  <div class="login-left-inner">
    <div class="left-mark">
      <img class="left-logo" src="assets/logo_icon.png" alt="CropSense AI logo" onerror="this.style.display='none';">
      <div class="left-title">CropSense AI</div>
    </div>

    <p class="left-desc">
      Welcome to the future of smart agriculture.
      Log in to access AI-powered soil analysis and crop prediction tools.
    </p>
  </div>
</aside>


      <!-- RIGHT PANEL -->
      <section class="login-right">
        <h2 class="login-h2">Login</h2>
        <div class="login-hint">Enter your credentials to continue</div>

        <form class="login-form" action="dashboard.html" method="get">
  <label class="field">
    <span class="field-label">Username</span>
    <input type="text" name="username" placeholder="Enter your username" autocomplete="username" required />
  </label>

  <label class="field">
    <span class="field-label">Password</span>
    <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
  </label>

  <button class="login-btn" type="submit">Login to Dashboard</button>
</form>


          <div class="divider">
  <span class="line"></span>
  <span class="text">OR</span>
  <span class="line"></span>
</div>

          <a class="home-page-btn" href="index.html">← Back to Home</a>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
